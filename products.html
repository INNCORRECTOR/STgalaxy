<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Products - ST Galaxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" href="data/products.json" as="fetch" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#020203;
      --glass-border:rgba(255,255,255,0.12);
      --text:#eef0ff;
      --text-muted:#7a7a9a;
      --cyan:#00e8ff;
      --violet:#8b5cf6;
      --glass-blur:blur(22px) saturate(200%);
      --glow-cyan:0 0 30px rgba(0,232,255,0.35);
    }

    @keyframes orb-float{
      0%, 100%{ transform:translate(0,0) scale(1); }
      50%{ transform:translate(20px,-30px) scale(1.05); }
    }

    @keyframes border-spin{
      0%{ background-position:0% 50%; }
      100%{ background-position:200% 50%; }
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Exo 2', system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg-orbs{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }

    .bg-orbs span{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      animation:orb-float 16s ease-in-out infinite;
    }

    .bg-orbs span:nth-child(1){ width:400px; height:400px; background:rgba(0,232,255,0.16); top:-8%; left:-10%; }
    .bg-orbs span:nth-child(2){ width:360px; height:360px; background:rgba(139,92,246,0.2); bottom:10%; right:-8%; animation-delay:-5s; }

    .bg-grid{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(0,232,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,232,255,0.03) 1px, transparent 1px);
      background-size:48px 48px;
      mask-image:radial-gradient(ellipse 70% 50% at 50% 30%, black, transparent 70%);
    }

    body > *:not(.bg-orbs):not(.bg-grid):not(.mobile-tabbar):not(#mobile-tabbar){ position:relative; z-index:1; }

    body > nav:first-of-type{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 8%;
      margin:12px 4% 0;
      border-radius:16px;
      background:rgba(255,255,255,0.03);
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 40px rgba(0,0,0,0.5), var(--glow-cyan);
    }

    body > nav:first-of-type h1{
      font-family:'Orbitron', sans-serif;
      font-size:1.2rem;
      background:linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:16px;
    }

    body > nav:first-of-type a{
      color:var(--text-muted);
      text-decoration:none;
      margin-left:0;
      transition:color 0.25s;
      text-transform:uppercase;
      letter-spacing:0.08em;
      font-size:0.9rem;
    }

    body > nav:first-of-type a:hover{
      color:var(--cyan);
      text-shadow:0 0 12px rgba(0,232,255,0.5);
    }

    .container{
      padding:50px 10%;
    }

    .title{
      text-align:center;
      margin-bottom:28px;
      padding:32px 24px;
      border-radius:20px;
      background:rgba(255,255,255,0.04);
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 36px rgba(0,0,0,0.35);
    }

    .title .subtitle{
      color:var(--cyan);
      font-size:0.85rem;
      letter-spacing:0.06em;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .title p{
      color:var(--text-muted);
    }

    .title h2{
      font-family:'Orbitron', sans-serif;
      font-size:42px;
      margin-bottom:10px;
      background:linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .category-heading{
      font-family:'Orbitron', sans-serif;
      text-align:center;
      font-size:1.5rem;
      letter-spacing:0.12em;
      margin-bottom:24px;
      color:var(--text);
    }

    .category-tabs{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-bottom:36px;
    }

    .category-tab{
      font-family:'Exo 2', sans-serif;
      font-size:0.85rem;
      letter-spacing:0.04em;
      text-transform:uppercase;
      padding:10px 18px;
      border-radius:999px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,0.04);
      color:var(--text-muted);
      cursor:pointer;
      transition:0.25s;
    }

    .category-tab:hover{
      color:var(--cyan);
      border-color:rgba(0,232,255,0.35);
    }

    .category-tab.active{
      color:#030304;
      font-weight:600;
      border-color:transparent;
      background:linear-gradient(135deg, var(--cyan), var(--violet));
      box-shadow:var(--glow-cyan);
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:25px;
    }

    .empty-state{
      grid-column:1 / -1;
      text-align:center;
      color:var(--text-muted);
      padding:40px 20px;
    }

    .product-card{
      border-radius:16px;
      overflow:hidden;
      background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      position:relative;
      transition:transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s;
    }

    .product-card::before{
      content:'';
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(120deg, var(--cyan), var(--violet), var(--cyan));
      background-size:200% 200%;
      animation:border-spin 5s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      pointer-events:none;
      opacity:0.5;
      z-index:2;
    }

    .product-card:hover{
      transform:translateY(-8px) scale(1.02);
      box-shadow:var(--glow-cyan), 0 20px 48px rgba(0,0,0,0.45);
    }

    .product-card:hover::before{
      opacity:1;
    }

    .product-image-wrap{
      position:relative;
      background:rgba(0,0,0,0.25);
    }

    .product-image-link,
    .product-card-link{
      display:block;
      text-decoration:none;
      color:inherit;
    }

    .product-card-link:hover h3{
      color:var(--cyan);
    }

    .product-card-link .product-info{
      cursor:pointer;
    }

    .photo-count{
      position:absolute;
      top:12px;
      right:12px;
      z-index:2;
      padding:5px 10px;
      border-radius:999px;
      font-size:0.75rem;
      font-weight:600;
      background:rgba(0,0,0,0.65);
      color:var(--cyan);
      border:1px solid rgba(0,232,255,0.35);
    }

    .product-card img{
      width:100%;
      height:250px;
      object-fit:cover;
      display:block;
    }

    .image-dots{
      position:absolute;
      bottom:12px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:8px;
    }

    .image-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,0.5);
      background:rgba(0,0,0,0.35);
      cursor:pointer;
      padding:0;
    }

    .image-dot.active{
      background:var(--cyan);
      border-color:var(--cyan);
      box-shadow:0 0 10px rgba(0,232,255,0.6);
    }

    .product-info{
      padding:20px;
      background:rgba(0,0,0,0.35);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .product-info h3{
      margin-bottom:8px;
      font-size:1.05rem;
      transition:color 0.25s;
    }

    .product-desc{
      color:var(--text-muted);
      font-size:0.95rem;
      line-height:1.45;
      margin-bottom:14px;
      display:-webkit-box;
      -webkit-line-clamp:1;
      -webkit-box-orient:vertical;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pricing{
      margin-bottom:16px;
    }

    .price-line{
      color:var(--cyan);
      font-size:1rem;
      font-weight:600;
      margin-bottom:6px;
      text-shadow:0 0 12px rgba(0,232,255,0.25);
    }

    .badge-soon{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      font-size:0.8rem;
      letter-spacing:0.06em;
      text-transform:uppercase;
      color:var(--violet);
      border:1px solid rgba(139,92,246,0.45);
      background:rgba(139,92,246,0.12);
    }

    .badge-check{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      font-size:0.8rem;
      letter-spacing:0.06em;
      text-transform:uppercase;
      color:var(--cyan);
      border:1px solid rgba(0,232,255,0.45);
      background:rgba(0,232,255,0.12);
    }

    .buy-btn{
      display:inline-block;
      padding:12px 20px;
      background:linear-gradient(135deg, var(--cyan), var(--violet));
      color:#030304;
      text-decoration:none;
      border-radius:6px;
      font-family:'Orbitron', sans-serif;
      font-size:0.75rem;
      letter-spacing:0.06em;
      font-weight:700;
      transition:0.3s;
    }

    .buy-btn:hover{
      box-shadow:0 0 20px rgba(0,232,255,0.4);
      transform:translateY(-2px);
    }

    .buy-btn-disabled{
      opacity:0.55;
      cursor:default;
      pointer-events:none;
    }

    .card-actions{
      padding:0 20px 20px;
    }

    .card-actions .buy-btn{
      display:block;
      width:100%;
      text-align:center;
    }

    .order-section{
      margin-top:56px;
      padding:32px 24px;
      text-align:center;
      border-radius:20px;
      background:rgba(255,255,255,0.04);
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
    }

    .order-section h3{
      font-family:'Orbitron', sans-serif;
      letter-spacing:0.1em;
      margin-bottom:20px;
    }

    .order-links{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:14px;
    }

    .order-links a{
      display:inline-block;
      padding:12px 22px;
      border-radius:8px;
      text-decoration:none;
      font-weight:600;
      letter-spacing:0.04em;
      transition:0.25s;
    }

    .order-links .whatsapp{
      background:linear-gradient(135deg, #25d366, #128c7e);
      color:#fff;
    }

    .order-links .instagram{
      background:linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color:#fff;
    }

    .order-links a:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(0,0,0,0.35);
    }

    footer{
      text-align:center;
      padding:24px;
      margin:50px 4% 24px;
      border-radius:16px;
      background:rgba(255,255,255,0.03);
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
      color:var(--text-muted);
    }

    .footer-links{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:16px;
      margin-bottom:14px;
    }

    .footer-links a{
      color:var(--text-muted);
      text-decoration:none;
      font-size:0.9rem;
      transition:color 0.25s;
    }

    .footer-links a:hover{
      color:var(--cyan);
    }

    @media (max-width: 768px){
      :root{
        --glass-blur:blur(16px) saturate(160%);
        --glow-cyan:0 0 20px rgba(0,232,255,0.25);
      }

      .bg-orbs span:nth-child(1){
        width:200px;
        height:200px;
      }

      .bg-orbs span:nth-child(2){
        width:180px;
        height:180px;
      }
    }

  </style>
  <link rel="stylesheet" href="css/site.css"/>
</head>

<body>

  <div class="bg-orbs" aria-hidden="true"><span></span><span></span></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <nav>
    <a href="index.html" class="brand">
      <div class="img-slot logo-slot">
        <picture>
          <source srcset="images/staticunchange/logo.webp" type="image/webp"/>
          <img src="images/staticunchange/logo.jpeg" alt="ST Galaxy logo" loading="eager" onload="this.closest('.img-slot').classList.add('has-image')" onerror="this.style.display='none'"/>
        </picture>
        <span class="slot-hint">Logo</span>
      </div>
      <h1>ST Galaxy</h1>
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <section class="container">

    <div class="title">
      <h2 id="page-heading">Our Products</h2>
      <p id="page-tagline">Airpods, Headphones, Chargers and more coming soon</p>
    </div>

    <div class="category-tabs" id="category-tabs" role="tablist" aria-label="Product categories"></div>

    <h3 class="category-heading" id="category-heading">AIRPODS</h3>

    <div class="products is-loading" id="product-grid" aria-busy="true" aria-label="Loading products"></div>

    <div class="order-section">
      <h3>TO ORDER</h3>
      <div class="order-links">
        <a href="#" class="whatsapp" id="contact-whatsapp" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a href="#" class="instagram" id="contact-instagram" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </div>

  </section>

  <footer id="site-footer"></footer>

  <nav id="mobile-tabbar" class="mobile-tabbar" aria-label="Mobile navigation"></nav>

  <script src="js/image-utils.js"></script>
  <script src="js/site.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
