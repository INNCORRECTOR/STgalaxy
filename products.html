<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products - ST Galaxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#020203;
      --glass-border:rgba(255,255,255,0.12);
      --text:#eef0ff;
      --text-muted:#7a7a9a;
      --cyan:#00e8ff;
      --violet:#8b5cf6;
      --glass-blur:blur(22px) saturate(200%);
      --glow-cyan:0 0 30px rgba(0,232,255,0.35);
    }

    @keyframes orb-float{
      0%, 100%{ transform:translate(0,0) scale(1); }
      50%{ transform:translate(20px,-30px) scale(1.05); }
    }

    @keyframes border-spin{
      0%{ background-position:0% 50%; }
      100%{ background-position:200% 50%; }
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Exo 2', system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg-orbs{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }

    .bg-orbs span{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      animation:orb-float 16s ease-in-out infinite;
    }

    .bg-orbs span:nth-child(1){ width:400px; height:400px; background:rgba(0,232,255,0.16); top:-8%; left:-10%; }
    .bg-orbs span:nth-child(2){ width:360px; height:360px; background:rgba(139,92,246,0.2); bottom:10%; right:-8%; animation-delay:-5s; }

    .bg-grid{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(0,232,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,232,255,0.03) 1px, transparent 1px);
      background-size:48px 48px;
      mask-image:radial-gradient(ellipse 70% 50% at 50% 30%, black, transparent 70%);
    }

    body > *:not(.bg-orbs):not(.bg-grid){ position:relative; z-index:1; }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 8%;
      margin:12px 4% 0;
      border-radius:16px;
      background:rgba(255,255,255,0.03);
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 40px rgba(0,0,0,0.5), var(--glow-cyan);
    }

    nav h1{
      font-family:'Orbitron', sans-serif;
      font-size:1.2rem;
      background:linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:16px;
    }

    nav a{
      color:var(--text-muted);
      text-decoration:none;
      margin-left:0;
      transition:color 0.25s;
      text-transform:uppercase;
      letter-spacing:0.08em;
      font-size:0.9rem;
    }

    nav a:hover{
      color:var(--cyan);
      text-shadow:0 0 12px rgba(0,232,255,0.5);
    }

    .container{
      padding:50px 10%;
    }

    .title{
      text-align:center;
      margin-bottom:50px;
      padding:32px 24px;
      border-radius:20px;
      background:rgba(255,255,255,0.04);
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 36px rgba(0,0,0,0.35);
    }

    .title p{
      color:var(--text-muted);
    }

    .title h2{
      font-family:'Orbitron', sans-serif;
      font-size:42px;
      margin-bottom:10px;
      background:linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .product-card{
      border-radius:16px;
      overflow:hidden;
      background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      position:relative;
      transition:transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s;
    }

    .product-card::before{
      content:'';
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(120deg, var(--cyan), var(--violet), var(--cyan));
      background-size:200% 200%;
      animation:border-spin 5s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      pointer-events:none;
      opacity:0.5;
      z-index:2;
    }

    .product-card:hover{
      transform:translateY(-8px) scale(1.02);
      box-shadow:var(--glow-cyan), 0 20px 48px rgba(0,0,0,0.45);
    }

    .product-card:hover::before{
      opacity:1;
    }

    .product-card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .product-info{
      padding:20px;
      background:rgba(0,0,0,0.35);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .product-info h3{
      margin-bottom:10px;
    }

    .price{
      color:var(--cyan);
      font-size:22px;
      margin-bottom:15px;
      font-weight:bold;
      text-shadow:0 0 12px rgba(0,232,255,0.3);
    }

    .buy-btn{
      display:inline-block;
      padding:12px 20px;
      background:linear-gradient(135deg, var(--cyan), var(--violet));
      color:#030304;
      text-decoration:none;
      border-radius:6px;
      font-family:'Orbitron', sans-serif;
      font-size:0.75rem;
      letter-spacing:0.06em;
      font-weight:700;
      transition:0.3s;
    }

    .buy-btn:hover{
      box-shadow:0 0 20px rgba(0,232,255,0.4);
      transform:translateY(-2px);
    }

    footer{
      text-align:center;
      padding:24px;
      margin:50px 4% 24px;
      border-radius:16px;
      background:rgba(255,255,255,0.03);
      backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
      color:var(--text-muted);
    }

    @media (max-width: 768px){
      :root{
        --glass-blur:blur(16px) saturate(160%);
        --glow-cyan:0 0 20px rgba(0,232,255,0.25);
      }

      nav{
        margin:8px 12px 0;
        padding:12px 16px;
        width:calc(100% - 24px);
        flex-wrap:wrap;
        gap:10px;
      }

      nav h1{
        font-size:1rem;
      }

      .nav-links{
        gap:10px;
      }

      nav a{
        font-size:0.75rem;
      }

      .container{
        padding:28px 12px;
      }

      .title{
        padding:24px 16px;
        margin-bottom:32px;
      }

      .title h2{
        font-size:clamp(1.5rem, 6vw, 2rem);
      }

      .title p{
        font-size:0.9rem;
      }

      .products{
        grid-template-columns:1fr;
        gap:20px;
      }

      .product-card img{
        height:200px;
      }

      .product-card:hover{
        transform:none;
      }

      .product-card:active{
        transform:scale(0.98);
      }

      footer{
        margin:32px 12px 16px;
        padding:18px 16px;
      }

      .bg-orbs span:nth-child(1){
        width:200px;
        height:200px;
      }

      .bg-orbs span:nth-child(2){
        width:180px;
        height:180px;
      }
    }

    @media (max-width: 480px){
      nav{
        flex-direction:column;
        align-items:stretch;
      }

      nav h1{
        text-align:center;
      }

      .nav-links{
        justify-content:center;
        width:100%;
        padding-top:8px;
        border-top:1px solid rgba(255,255,255,0.06);
      }

      .title h2{
        font-size:1.35rem;
      }
    }

  </style>
</head>

<body>

  <div class="bg-orbs" aria-hidden="true"><span></span><span></span></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <nav>
    <h1>ST Galaxy</h1>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
    </div>
  </nav>

  <section class="container">

    <div class="title">
      <h2>Our Products</h2>
      <p>Premium phone cases, chargers, earbuds and more.</p>
    </div>

    <div class="products">

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1601593346740-925612772716?w=800&amp;q=80&amp;auto=format&amp;fit=crop" alt="Phone case" loading="lazy">

        <div class="product-info">

          </a>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&amp;q=80&amp;fit=crop" alt="Wireless earbuds" loading="lazy">

        <div class="product-info">
          <h3>Wireless Earbuds</h3>
          <div class="price">₹899</div>

          <a href="https://wa.me/919089030805" class="buy-btn" target="_blank" rel="noopener noreferrer">
            Buy Now
          </a>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=800&amp;q=80&amp;fit=crop" alt="Fast charger" loading="lazy">

        <div class="product-info">
          <h3>Fast Charger &amp; Cable Set</h3>
          <div class="price">₹499</div>

          <a href="https://wa.me/919089030805" class="buy-btn" target="_blank" rel="noopener noreferrer">
            Buy Now
          </a>
        </div>
      </div>

    </div>

  </section>

  <footer>
    © 2026 ST Galaxy. All rights reserved.
  </footer>

</body>
</html>
